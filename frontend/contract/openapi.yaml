openapi: 3.1.0
info:
  title: Fab Canvas backend API
  version: 1.0.0
  summary: The API the Fab Canvas frontend (npm package `fab-canvas`) calls.
  description: |
    Implement these endpoints in your backend and point the app at them with `apiBase`
    (docs/packaging.md). Prose and rules (ops semantics, permissions, caching) are in
    docs/api.md; this file is the machine-readable form and is checked in CI against every
    response the UI receives from the reference mock.

    Conventions:
    - JSON bodies with camelCase fields; timestamps are ISO 8601 UTC strings.
    - Identity comes from the `x-knox-id` header set by your gateway (no other auth).
    - Every response should carry `x-request-id`; errors use the `Error` envelope.
    - Component and group ids are generated by the client (UUIDs); canvas ids by the server.
servers:
  - url: /api
    description: Relative to the app's origin (the default `apiBase`).
security:
  - knoxId: []
tags:
  - name: Identity
  - name: Canvases
  - name: Sharing
  - name: Data
  - name: Filters
  - name: Admin

paths:
  /me:
    get:
      tags: [Identity]
      summary: The calling user
      operationId: getMe
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Me' } } } }
        '401': { $ref: '#/components/responses/Error' }

  /users:
    get:
      tags: [Identity]
      summary: Known users, for share and ACL dialogs
      operationId: searchUsers
      parameters:
        - { name: search, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties: { items: { type: array, items: { $ref: '#/components/schemas/UserRef' } } }

  /canvases:
    get:
      tags: [Canvases]
      summary: Canvases the caller owns or that are shared with them
      operationId: listCanvases
      parameters:
        - { name: scope, in: query, schema: { type: string, enum: [mine, shared, all], default: mine }, description: '`all` is admin-only.' }
        - { name: search, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/CanvasSummary' } }
                  nextCursor: { type: [string, 'null'] }
        '403': { $ref: '#/components/responses/Error' }
    post:
      tags: [Canvases]
      summary: Create a canvas (the caller becomes the owner)
      operationId: createCanvas
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateCanvasRequest' } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Canvas' } } } }
        '400': { $ref: '#/components/responses/Error' }

  /canvases/{id}:
    parameters: [{ $ref: '#/components/parameters/CanvasId' }]
    get:
      tags: [Canvases]
      summary: A canvas with its groups and the components the caller may view
      operationId: getCanvas
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Canvas' } } } }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      tags: [Canvases]
      summary: Soft-delete (owner or admin)
      operationId: deleteCanvas
      responses:
        '204': { description: Deleted }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /canvases/{id}/duplicate:
    parameters: [{ $ref: '#/components/parameters/CanvasId' }]
    post:
      tags: [Canvases]
      summary: Copy the components the caller can view into a new canvas they own
      operationId: duplicateCanvas
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/DuplicateCanvasRequest' } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Canvas' } } } }
        '404': { $ref: '#/components/responses/Error' }

  /canvases/{id}/ops:
    parameters: [{ $ref: '#/components/parameters/CanvasId' }]
    post:
      tags: [Canvases]
      summary: Apply a batch of edits atomically (see docs/api.md for the rules)
      operationId: applyOps
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/OpsRequest' } } }
      responses:
        '200': { description: Applied, content: { application/json: { schema: { $ref: '#/components/schemas/OpsResult' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409':
          description: Version conflict; `details.conflicts[].current` is the entity as stored (or null if gone).
          content: { application/json: { schema: { $ref: '#/components/schemas/VersionConflictError' } } }

  /canvases/{id}/shares:
    parameters: [{ $ref: '#/components/parameters/CanvasId' }]
    get:
      tags: [Sharing]
      summary: Who the canvas is shared with (owner or admin)
      operationId: getShares
      responses:
        '200': { $ref: '#/components/responses/Shares' }
        '403': { $ref: '#/components/responses/Error' }
    put:
      tags: [Sharing]
      summary: Replace the share list (owner or admin)
      operationId: putShares
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [shares]
              properties: { shares: { type: array, items: { $ref: '#/components/schemas/Share' } } }
      responses:
        '200': { $ref: '#/components/responses/Shares' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /canvases/{id}/components/{cid}/access:
    parameters:
      - { $ref: '#/components/parameters/CanvasId' }
      - { name: cid, in: path, required: true, schema: { type: string } }
    get:
      tags: [Sharing]
      summary: A component's restrictions and ACL (owner or admin)
      operationId: getComponentAccess
      responses:
        '200': { $ref: '#/components/responses/ComponentAccess' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    put:
      tags: [Sharing]
      summary: Replace restrictions and ACL; bumps the component version
      operationId: putComponentAccess
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ComponentAccessSettings' } } }
      responses:
        '200': { $ref: '#/components/responses/ComponentAccess' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /datasets:
    get:
      tags: [Data]
      summary: Datasets defined by the admin (as code)
      operationId: listDatasets
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties: { items: { type: array, items: { $ref: '#/components/schemas/Dataset' } } }

  /datasets/{id}/values/{param}:
    get:
      tags: [Data]
      summary: Suggested values for a dataset parameter (enum values or `valuesFrom`)
      operationId: getParamValues
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: param, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/Search' }
        - { $ref: '#/components/parameters/ValuesLimit' }
      responses:
        '200': { $ref: '#/components/responses/Values' }
        '404': { $ref: '#/components/responses/Error' }

  /query:
    post:
      tags: [Data]
      summary: Run a dataset with params and shape the result server-side
      operationId: query
      description: |
        Returns columnar JSON. If the request has `Accept: application/vnd.apache.arrow.stream`
        and the result is large, the server may answer with an Arrow IPC stream instead and
        put `meta` (JSON) in the `x-query-meta` header.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/QueryRequest' } } }
      responses:
        '200':
          description: OK
          content:
            application/json: { schema: { $ref: '#/components/schemas/QueryResult' } }
            application/vnd.apache.arrow.stream: { schema: { type: string, format: binary } }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
        '504': { $ref: '#/components/responses/Error' }

  /filters:
    get:
      tags: [Filters]
      summary: The shared filter vocabulary
      operationId: listFilterDimensions
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties: { items: { type: array, items: { $ref: '#/components/schemas/FilterDimension' } } }

  /filters/{id}/values:
    get:
      tags: [Filters]
      summary: Values for a filter dimension's picker
      operationId: getFilterValues
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/Search' }
        - { $ref: '#/components/parameters/ValuesLimit' }
      responses:
        '200': { $ref: '#/components/responses/Values' }
        '404': { $ref: '#/components/responses/Error' }

  /admin/admins:
    get:
      tags: [Admin]
      summary: Admins (granted here, and bootstrap admins from config)
      operationId: listAdmins
      responses:
        '200': { $ref: '#/components/responses/AdminList' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      tags: [Admin]
      summary: Grant admin rights
      operationId: grantAdmin
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [knoxId], properties: { knoxId: { type: string } } }
      responses:
        '201':
          description: Granted
          content:
            application/json:
              schema: { type: object, required: [knoxId], properties: { knoxId: { type: string } } }
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /admin/admins/{knoxId}:
    delete:
      tags: [Admin]
      summary: Revoke admin rights (not for config admins or the last granted admin)
      operationId: revokeAdmin
      parameters: [{ $ref: '#/components/parameters/KnoxId' }]
      responses:
        '204': { description: Revoked }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /admin/canvases:
    get:
      tags: [Admin]
      summary: Every canvas, with share and restriction counts
      operationId: adminListCanvases
      parameters:
        - { name: search, in: query, schema: { type: string } }
        - { name: owner, in: query, schema: { type: string } }
        - { name: deleted, in: query, schema: { type: boolean }, description: Include soft-deleted canvases. }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties: { items: { type: array, items: { $ref: '#/components/schemas/AdminCanvas' } } }

  /admin/canvases/{id}/transfer:
    parameters: [{ $ref: '#/components/parameters/CanvasId' }]
    post:
      tags: [Admin]
      summary: Transfer ownership
      operationId: transferCanvas
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [newOwner]
              properties:
                newOwner: { type: string }
                keepPreviousAsEditor: { type: boolean, default: true }
      responses:
        '200':
          description: Transferred
          content:
            application/json:
              schema:
                type: object
                required: [id, owner]
                properties: { id: { type: string }, owner: { $ref: '#/components/schemas/UserRef' } }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /admin/canvases/{id}/restore:
    parameters: [{ $ref: '#/components/parameters/CanvasId' }]
    post:
      tags: [Admin]
      summary: Undo a soft delete
      operationId: restoreCanvas
      responses:
        '200':
          description: Restored
          content: { application/json: { schema: { type: object, required: [id], properties: { id: { type: string } } } } }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /admin/users/{knoxId}/access:
    get:
      tags: [Admin]
      summary: What a person can access
      operationId: userAccess
      parameters: [{ $ref: '#/components/parameters/KnoxId' }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/UserAccess' } } } }
        '404': { $ref: '#/components/responses/Error' }

  /admin/users/{knoxId}/revoke-shares:
    post:
      tags: [Admin]
      summary: Remove every share for a person
      operationId: revokeShares
      parameters: [{ $ref: '#/components/parameters/KnoxId' }]
      responses:
        '200':
          description: Done
          content: { application/json: { schema: { type: object, required: [removed], properties: { removed: { type: integer } } } } }

  /admin/users/{knoxId}/transfer-all:
    post:
      tags: [Admin]
      summary: Transfer every canvas a person owns
      operationId: transferAll
      parameters: [{ $ref: '#/components/parameters/KnoxId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [newOwner], properties: { newOwner: { type: string } } }
      responses:
        '200':
          description: Done
          content: { application/json: { schema: { type: object, required: [transferred], properties: { transferred: { type: integer } } } } }
        '400': { $ref: '#/components/responses/Error' }

  /admin/usage/overview:
    get:
      tags: [Admin]
      summary: Usage tiles and time series
      operationId: usageOverview
      parameters: [{ $ref: '#/components/parameters/Range' }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/UsageOverview' } } } }

  /admin/usage/datasets:
    get:
      tags: [Admin]
      summary: Per-dataset usage
      operationId: datasetUsage
      parameters: [{ $ref: '#/components/parameters/Range' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties: { items: { type: array, items: { $ref: '#/components/schemas/DatasetUsage' } } }

  /admin/usage/datasets/{id}:
    get:
      tags: [Admin]
      summary: One dataset's latency, errors, slowest calls and users
      operationId: datasetDetail
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/Range' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/DatasetDetail' } } } }
        '404': { $ref: '#/components/responses/Error' }

  /admin/usage/slow:
    get:
      tags: [Admin]
      summary: Calls slower than a threshold
      operationId: slowQueries
      parameters:
        - { $ref: '#/components/parameters/Range' }
        - { name: thresholdMs, in: query, schema: { type: integer, default: 10000 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties: { items: { type: array, items: { $ref: '#/components/schemas/QueryEvent' } } }

  /admin/usage/errors:
    get:
      tags: [Admin]
      summary: Recent failures, with counts per code
      operationId: errorEvents
      parameters:
        - { $ref: '#/components/parameters/Range' }
        - { name: code, in: query, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, codes]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/ErrorEvent' } }
                  codes: { type: array, items: { $ref: '#/components/schemas/CodeCount' } }

  /admin/health:
    get:
      tags: [Admin]
      summary: Live status of the data API, database, cache, concurrency and app
      operationId: health
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Health' } } } }

  /admin/audit:
    get:
      tags: [Admin]
      summary: Audit log
      operationId: audit
      parameters:
        - { $ref: '#/components/parameters/Range' }
        - { name: actor, in: query, schema: { type: string } }
        - { name: action, in: query, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, actions]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/AuditEntry' } }
                  actions: { type: array, items: { type: string }, description: Every action name, for the filter. }

components:
  securitySchemes:
    knoxId:
      type: apiKey
      in: header
      name: x-knox-id
      description: The authenticated user, set by the gateway in front of the backend.

  parameters:
    CanvasId: { name: id, in: path, required: true, schema: { type: string } }
    KnoxId: { name: knoxId, in: path, required: true, schema: { type: string } }
    Search: { name: search, in: query, schema: { type: string } }
    ValuesLimit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 50 } }
    Range:
      name: range
      in: query
      description: Time window ending now (or use `from`/`to`, ISO 8601).
      schema: { type: string, enum: [24h, 7d, 30d], default: 7d }

  responses:
    Error:
      description: Error envelope
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Values:
      description: OK
      content: { application/json: { schema: { $ref: '#/components/schemas/ValuesResponse' } } }
    Shares:
      description: OK
      content:
        application/json:
          schema:
            type: object
            required: [shares]
            properties: { shares: { type: array, items: { $ref: '#/components/schemas/Share' } } }
    ComponentAccess:
      description: OK
      content:
        application/json:
          schema:
            allOf:
              - { $ref: '#/components/schemas/ComponentAccessSettings' }
              - { type: object, required: [version], properties: { version: { type: integer } } }
    AdminList:
      description: OK
      content:
        application/json:
          schema:
            type: object
            required: [items]
            properties: { items: { type: array, items: { $ref: '#/components/schemas/AdminEntry' } } }

  schemas:
    # ---------------------------------------------------------------- common
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, examples: [VERSION_CONFLICT, NOT_FOUND, FORBIDDEN, UPSTREAM_TIMEOUT] }
            message: { type: string }
            requestId: { type: string }
            details: {}
    Me:
      type: object
      required: [knoxId, displayName, isAdmin]
      properties:
        knoxId: { type: string }
        displayName: { type: string }
        isAdmin: { type: boolean }
    UserRef:
      type: object
      required: [knoxId, displayName]
      properties:
        knoxId: { type: string }
        displayName: { type: string }
    Timestamp: { type: string, description: ISO 8601 UTC }

    # ---------------------------------------------------------------- filters
    TimeRangeValue:
      oneOf:
        - type: object
          required: [relative]
          properties: { relative: { type: string, examples: [last_24h, last_7d, last_30d, last_90d] } }
          additionalProperties: false
        - type: object
          required: [start, end]
          properties: { start: { $ref: '#/components/schemas/Timestamp' }, end: { $ref: '#/components/schemas/Timestamp' } }
          additionalProperties: false
    FilterValue:
      anyOf:
        - { type: array, items: { type: string } }
        - { $ref: '#/components/schemas/TimeRangeValue' }
        - type: object
          properties: { min: { type: number }, max: { type: number } }
          additionalProperties: false
    FilterSet:
      type: object
      additionalProperties: { $ref: '#/components/schemas/FilterValue' }
      description: Filter values keyed by dimension id.
    FilterDimension:
      type: object
      required: [id, label, type, hasValues, default]
      properties:
        id: { type: string }
        label: { type: string }
        type: { type: string, enum: [string_list, time_range, number_range] }
        hasValues: { type: boolean, description: 'Values can be looked up with /filters/{id}/values.' }
        default: { anyOf: [{ $ref: '#/components/schemas/FilterValue' }, { type: 'null' }] }

    # ---------------------------------------------------------------- canvases
    CanvasRole:
      type: string
      enum: [owner, editor, viewer, admin]
      description: '`admin`: access only through app-wide admin rights.'
    CanvasSummary:
      type: object
      required: [id, title, description, owner, role, componentCount, version, updatedAt]
      properties:
        id: { type: string }
        title: { type: string, maxLength: 120 }
        description: { type: string, maxLength: 1000 }
        owner: { $ref: '#/components/schemas/UserRef' }
        role: { $ref: '#/components/schemas/CanvasRole' }
        componentCount: { type: integer }
        version: { type: integer }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
    ComponentAccess:
      type: object
      required: [canEdit, viewRestricted, editRestricted]
      properties:
        canEdit: { type: boolean, description: Whether the caller may edit this component. }
        viewRestricted: { type: boolean }
        editRestricted: { type: boolean }
    CanvasComponent:
      type: object
      required: [id, type, title, groupId, x, y, w, h, zIndex, config, configVersion, version, access, updatedBy, updatedAt]
      properties:
        id: { type: string }
        type: { type: string, examples: [chart, table, wafer-map, note, data-preview] }
        title: { type: string }
        groupId: { type: [string, 'null'] }
        x: { type: number, description: Relative to the group when groupId is set. }
        y: { type: number }
        w: { type: number }
        h: { type: number }
        zIndex: { type: integer }
        config: { type: object, description: Opaque to the backend; validated by the frontend. }
        configVersion: { type: integer }
        version: { type: integer }
        access: { $ref: '#/components/schemas/ComponentAccess' }
        updatedBy: { type: string }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
    CanvasGroup:
      type: object
      required: [id, title, x, y, w, h, zIndex, collapsed, defaultFilters, version]
      properties:
        id: { type: string }
        title: { type: string }
        x: { type: number }
        y: { type: number }
        w: { type: number }
        h: { type: number }
        zIndex: { type: integer }
        collapsed: { type: boolean }
        defaultFilters: { $ref: '#/components/schemas/FilterSet' }
        version: { type: integer }
    Canvas:
      type: object
      required: [id, title, description, owner, role, canManageAccess, version, revision, defaultFilters, groups, components, updatedAt]
      properties:
        id: { type: string }
        title: { type: string }
        description: { type: string }
        owner: { $ref: '#/components/schemas/UserRef' }
        role: { $ref: '#/components/schemas/CanvasRole' }
        canManageAccess: { type: boolean }
        version: { type: integer }
        revision: { type: integer, description: Increases with every applied ops batch. }
        defaultFilters: { $ref: '#/components/schemas/FilterSet' }
        groups: { type: array, items: { $ref: '#/components/schemas/CanvasGroup' } }
        components:
          type: array
          items: { $ref: '#/components/schemas/CanvasComponent' }
          description: Only components the caller may view.
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
    CreateCanvasRequest:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 1000 }
    DuplicateCanvasRequest:
      type: object
      required: [title]
      properties: { title: { type: string, minLength: 1, maxLength: 120 } }

    # ---------------------------------------------------------------- ops
    EditableComponentFields:
      type: object
      properties:
        title: { type: string }
        groupId: { type: [string, 'null'] }
        x: { type: number }
        y: { type: number }
        w: { type: number }
        h: { type: number }
        zIndex: { type: integer }
        config: { type: object }
        configVersion: { type: integer }
      additionalProperties: false
    NewComponent:
      type: object
      description: A component created by the client (it chooses the id, a UUID).
      required: [id, type, title, groupId, x, y, w, h, zIndex, config, configVersion]
      properties:
        id: { type: string }
        type: { type: string }
        title: { type: string }
        groupId: { type: [string, 'null'] }
        x: { type: number }
        y: { type: number }
        w: { type: number }
        h: { type: number }
        zIndex: { type: integer }
        config: { type: object }
        configVersion: { type: integer }
      additionalProperties: false
    EditableGroupFields:
      type: object
      properties:
        title: { type: string }
        x: { type: number }
        y: { type: number }
        w: { type: number }
        h: { type: number }
        zIndex: { type: integer }
        collapsed: { type: boolean }
        defaultFilters: { $ref: '#/components/schemas/FilterSet' }
      additionalProperties: false
    CanvasOp:
      oneOf:
        - type: object
          required: [op, version, set]
          properties:
            op: { const: canvas.update }
            version: { type: integer }
            set:
              type: object
              properties:
                title: { type: string }
                description: { type: string }
                defaultFilters: { $ref: '#/components/schemas/FilterSet' }
              additionalProperties: false
        - type: object
          required: [op, component]
          properties:
            op: { const: component.create }
            component: { $ref: '#/components/schemas/NewComponent' }
        - type: object
          required: [op, id, version, set]
          properties:
            op: { const: component.update }
            id: { type: string }
            version: { type: integer }
            set: { $ref: '#/components/schemas/EditableComponentFields' }
        - type: object
          required: [op, id, version]
          properties:
            op: { const: component.delete }
            id: { type: string }
            version: { type: integer }
        - type: object
          required: [op, group]
          properties:
            op: { const: group.create }
            group:
              type: object
              required: [id, title]
              properties:
                id: { type: string }
                title: { type: string }
                x: { type: number }
                y: { type: number }
                w: { type: number }
                h: { type: number }
                zIndex: { type: integer }
                collapsed: { type: boolean }
                defaultFilters: { $ref: '#/components/schemas/FilterSet' }
        - type: object
          required: [op, id, version, set]
          properties:
            op: { const: group.update }
            id: { type: string }
            version: { type: integer }
            set: { $ref: '#/components/schemas/EditableGroupFields' }
        - type: object
          required: [op, id, version, mode]
          properties:
            op: { const: group.delete }
            id: { type: string }
            version: { type: integer }
            mode: { type: string, enum: [ungroup, withContents] }
    OpsRequest:
      type: object
      required: [ops]
      properties: { ops: { type: array, items: { $ref: '#/components/schemas/CanvasOp' } } }
    OpsResult:
      type: object
      required: [revision, versions]
      properties:
        revision: { type: integer }
        versions:
          type: object
          additionalProperties: { type: integer }
          description: New version per created/updated entity id; the canvas itself as "canvas".
    VersionConflictError:
      allOf:
        - { $ref: '#/components/schemas/Error' }
        - type: object
          properties:
            error:
              type: object
              properties:
                details:
                  type: object
                  required: [conflicts]
                  properties:
                    conflicts:
                      type: array
                      items:
                        type: object
                        required: [opIndex, id, current]
                        properties:
                          opIndex: { type: integer }
                          id: { type: string }
                          current: { description: The entity as stored, or null if it no longer exists. }

    # ---------------------------------------------------------------- sharing
    Share:
      type: object
      required: [knoxId, role]
      properties:
        knoxId: { type: string }
        role: { type: string, enum: [editor, viewer] }
        displayName: { type: string, description: Responses only. }
    AclEntry:
      type: object
      required: [knoxId, access]
      properties:
        knoxId: { type: string }
        access: { type: string, enum: [view, edit] }
        displayName: { type: string, description: Responses only. }
    ComponentAccessSettings:
      type: object
      required: [viewRestricted, editRestricted, acl]
      properties:
        viewRestricted: { type: boolean }
        editRestricted: { type: boolean }
        acl: { type: array, items: { $ref: '#/components/schemas/AclEntry' } }

    # ---------------------------------------------------------------- data
    DatasetParam:
      type: object
      required: [name, type, required, filter, valuesFrom]
      properties:
        name: { type: string }
        label: { type: string }
        type: { type: string, enum: [string, 'string[]', int, float, bool, date, datetime, enum] }
        required: { type: boolean }
        filter:
          type: [string, 'null']
          description: Filter dimension the param follows, e.g. "tool_id" or "time_range.start".
        valuesFrom:
          oneOf:
            - type: 'null'
            - type: object
              required: [dataset, column]
              properties:
                dataset: { type: string }
                column: { type: string }
                params: { type: object, description: Fixed params for the source dataset (relative times allowed). }
                order: { type: string, enum: [asc, desc] }
        values: { type: array, items: { type: string }, description: Allowed values for enums. }
        default: { description: 'Default value; datetimes may be relative ("now", "-7d").' }
        requiredGroup: { type: string, description: At least one param with the same group must be set. }
    DatasetColumn:
      type: object
      required: [name, type]
      properties:
        name: { type: string }
        type: { type: string, enum: [string, int, float, bool, datetime] }
        label: { type: string }
    Dataset:
      type: object
      required: [id, label, category, description, params, columns, tooltip, suits]
      properties:
        id: { type: string }
        label: { type: string }
        category: { type: string }
        description: { type: string }
        params: { type: array, items: { $ref: '#/components/schemas/DatasetParam' } }
        columns: { type: array, items: { $ref: '#/components/schemas/DatasetColumn' } }
        tooltip: { type: array, items: { type: string } }
        suits: { type: array, items: { type: string, enum: [chart, table, wafer-map, data-preview] } }
    ValuesResponse:
      type: object
      required: [values, truncated]
      properties:
        values: { type: array, items: { type: string } }
        truncated: { type: boolean }
    ColumnFilter:
      type: object
      required: [column, op, value]
      properties:
        column: { type: string }
        op: { type: string, enum: [contains, equals, notEquals, startsWith, gt, gte, lt, lte, in] }
        value: {}
    Shape:
      description: How the server reduces the result for the component (docs/data-layer.md).
      oneOf:
        - type: object
          required: [kind, limit]
          properties:
            kind: { const: raw }
            columns: { type: array, items: { type: string } }
            limit: { type: integer, maximum: 10000 }
        - type: object
          required: [kind, x, y, targetPoints]
          properties:
            kind: { const: timeseries }
            x: { type: string }
            y: { type: array, items: { type: string } }
            seriesBy: { type: string }
            targetPoints: { type: integer }
            xRange: { type: array, items: { type: string }, minItems: 2, maxItems: 2 }
        - type: object
          required: [kind, x, y, maxPoints]
          properties:
            kind: { const: scatter }
            x: { type: string }
            y: { type: string }
            colorBy: { type: string }
            maxPoints: { type: integer }
        - type: object
          required: [kind, column]
          properties:
            kind: { const: histogram }
            column: { type: string }
            bins: { type: integer }
            groupBy: { type: string }
        - type: object
          required: [kind, value, groupBy]
          properties:
            kind: { const: boxplot }
            value: { type: string }
            groupBy: { type: string }
            maxOutliers: { type: integer }
        - type: object
          required: [kind, offset, limit]
          properties:
            kind: { const: table }
            columns: { type: array, items: { type: string } }
            offset: { type: integer }
            limit: { type: integer }
            sort:
              type: array
              items:
                type: object
                required: [column, dir]
                properties: { column: { type: string }, dir: { type: string, enum: [asc, desc] } }
            filters: { type: array, items: { $ref: '#/components/schemas/ColumnFilter' } }
        - type: object
          required: [kind, x, y, value, mode, aggregate]
          properties:
            kind: { const: wafer }
            x: { type: string }
            y: { type: string }
            value: { type: string }
            waferBy: { type: string }
            mode: { type: string, enum: [single, gallery, stacked] }
            aggregate: { type: string, enum: [mean, median, std, min, max, count] }
            wafers: { type: array, items: { type: string }, description: Gallery paging. }
        - type: object
          required: [kind, column, limit]
          properties:
            kind: { const: distinct }
            column: { type: string }
            search: { type: string }
            limit: { type: integer }
    QueryRequest:
      type: object
      required: [dataset, params, shape]
      properties:
        dataset: { type: string }
        params: { type: object, description: 'Resolved param values (absolute times).' }
        shape: { $ref: '#/components/schemas/Shape' }
        context:
          type: object
          properties: { canvasId: { type: string }, componentId: { type: string } }
          description: For logging only.
        cache: { type: string, enum: [default, refresh] }
    QueryMeta:
      type: object
      required: [shape, rowsUpstream, rowsReturned, downsampled, cacheHit, asOf, durationMs, upstreamMs]
      properties:
        shape: { type: string, enum: [raw, timeseries, scatter, histogram, boxplot, table, wafer, distinct] }
        rowsUpstream: { type: integer }
        rowsReturned: { type: integer }
        downsampled: { type: boolean }
        cacheHit: { type: boolean }
        asOf: { $ref: '#/components/schemas/Timestamp' }
        durationMs: { type: number }
        upstreamMs: { type: number }
        requestId: { type: string }
        totalRows: { type: integer, description: 'table: rows after column filters.' }
        edges: { type: array, items: { type: number }, description: 'histogram: bin edges.' }
        xRange: { type: array, items: { type: number }, minItems: 2, maxItems: 2 }
        yRange: { type: array, items: { type: number }, minItems: 2, maxItems: 2 }
        valueRange: { type: array, items: { type: number }, minItems: 2, maxItems: 2 }
        wafers: { type: array, items: { type: string }, description: 'wafer: every wafer id, for paging.' }
    QueryResult:
      type: object
      required: [columns, data, meta]
      properties:
        columns:
          type: array
          items:
            type: object
            required: [name, type]
            properties:
              name: { type: string }
              type: { type: string, enum: [string, int, float, bool, datetime, unknown] }
        data:
          type: object
          additionalProperties: { type: array }
          description: One array per column, all the same length (columnar).
        meta: { $ref: '#/components/schemas/QueryMeta' }

    # ---------------------------------------------------------------- admin
    AdminEntry:
      allOf:
        - { $ref: '#/components/schemas/UserRef' }
        - type: object
          required: [source, grantedBy, grantedAt]
          properties:
            source: { type: string, enum: [db, config] }
            grantedBy: { type: [string, 'null'] }
            grantedAt: { type: [string, 'null'] }
    AdminCanvas:
      type: object
      required: [id, title, owner, shareCount, restrictedCount, componentCount, updatedAt, deletedAt]
      properties:
        id: { type: string }
        title: { type: string }
        owner: { $ref: '#/components/schemas/UserRef' }
        shareCount: { type: integer }
        restrictedCount: { type: integer }
        componentCount: { type: integer }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
        deletedAt: { type: [string, 'null'] }
    CanvasComponentRef:
      type: object
      required: [canvasId, canvasTitle, componentId, componentTitle]
      properties:
        canvasId: { type: string }
        canvasTitle: { type: string }
        componentId: { type: string }
        componentTitle: { type: string }
    UserAccess:
      type: object
      required: [user, isAdmin, owned, shared, acl, hiddenFrom]
      properties:
        user: { $ref: '#/components/schemas/UserRef' }
        isAdmin: { type: boolean }
        owned:
          type: array
          items:
            type: object
            required: [id, title, updatedAt]
            properties: { id: { type: string }, title: { type: string }, updatedAt: { type: string } }
        shared:
          type: array
          items:
            type: object
            required: [id, title, role, owner]
            properties:
              id: { type: string }
              title: { type: string }
              role: { $ref: '#/components/schemas/CanvasRole' }
              owner: { $ref: '#/components/schemas/UserRef' }
        acl:
          type: array
          items:
            allOf:
              - { $ref: '#/components/schemas/CanvasComponentRef' }
              - { type: object, required: [access], properties: { access: { type: string, enum: [view, edit] } } }
        hiddenFrom: { type: array, items: { $ref: '#/components/schemas/CanvasComponentRef' } }
    UsageOverview:
      type: object
      required: [from, to, tiles, hourly, dailyUsers, topCanvases, componentMix]
      properties:
        from: { type: string }
        to: { type: string }
        tiles:
          type: object
          required: [activeUsers, queries, cacheHitRate, errorRate, p95Ms, canvasesCreated]
          properties:
            activeUsers: { type: integer }
            queries: { type: integer }
            cacheHitRate: { type: number, minimum: 0, maximum: 1 }
            errorRate: { type: number, minimum: 0, maximum: 1 }
            p95Ms: { type: number }
            canvasesCreated: { type: integer }
        hourly:
          type: array
          items:
            type: object
            required: [t, queries, errors]
            properties: { t: { type: string }, queries: { type: integer }, errors: { type: integer } }
        dailyUsers:
          type: array
          items:
            type: object
            required: [day, users]
            properties: { day: { type: string, description: YYYY-MM-DD }, users: { type: integer } }
        topCanvases:
          type: array
          items:
            type: object
            required: [id, title, queries]
            properties: { id: { type: string }, title: { type: string }, queries: { type: integer } }
        componentMix:
          type: array
          items:
            type: object
            required: [type, count]
            properties: { type: { type: string }, count: { type: integer } }
    DatasetUsage:
      type: object
      required: [id, label, calls, users, cacheHitRate, p50Ms, p95Ms, errorRate, avgUpstreamRows, avgReturnedRows]
      properties:
        id: { type: string }
        label: { type: string }
        calls: { type: integer }
        users: { type: integer }
        cacheHitRate: { type: number }
        p50Ms: { type: number }
        p95Ms: { type: number }
        errorRate: { type: number }
        avgUpstreamRows: { type: number }
        avgReturnedRows: { type: number }
    QueryEvent:
      type: object
      required: [ts, user, dataset, canvasId, canvasTitle, componentId, durationMs, upstreamMs, shapingMs, rows, requestId]
      properties:
        ts: { type: string }
        user: { type: string }
        dataset: { type: string }
        canvasId: { type: [string, 'null'] }
        canvasTitle: { type: [string, 'null'] }
        componentId: { type: [string, 'null'] }
        durationMs: { type: number }
        upstreamMs: { type: number }
        shapingMs: { type: number }
        rows: { type: integer }
        requestId: { type: string }
    ErrorEvent:
      type: object
      required: [ts, user, dataset, canvasId, canvasTitle, componentId, code, message, requestId]
      properties:
        ts: { type: string }
        user: { type: string }
        dataset: { type: string }
        canvasId: { type: [string, 'null'] }
        canvasTitle: { type: [string, 'null'] }
        componentId: { type: [string, 'null'] }
        code: { type: string }
        message: { type: string }
        requestId: { type: string }
    CodeCount:
      type: object
      required: [code, count]
      properties: { code: { type: string }, count: { type: integer } }
    DatasetDetail:
      type: object
      required: [dataset, latency, errorsByCode, slowest, canvases]
      properties:
        dataset: { $ref: '#/components/schemas/DatasetUsage' }
        latency:
          type: array
          items:
            type: object
            required: [t, p50Ms, p95Ms, calls]
            properties: { t: { type: string }, p50Ms: { type: number }, p95Ms: { type: number }, calls: { type: integer } }
        errorsByCode: { type: array, items: { $ref: '#/components/schemas/CodeCount' } }
        slowest: { type: array, items: { $ref: '#/components/schemas/QueryEvent' } }
        canvases:
          type: array
          items:
            type: object
            required: [id, title, components]
            properties: { id: { type: string }, title: { type: string }, components: { type: integer } }
    HealthStatus: { type: string, enum: [ok, degraded, down] }
    Health:
      type: object
      required: [checkedAt, dataApi, database, cache, concurrency, app]
      properties:
        checkedAt: { type: string }
        dataApi:
          type: object
          required: [status, latencyMs, lastSuccess, lastFailure, history]
          properties:
            status: { $ref: '#/components/schemas/HealthStatus' }
            latencyMs: { type: [number, 'null'] }
            lastSuccess: { type: [string, 'null'] }
            lastFailure:
              oneOf:
                - type: 'null'
                - type: object
                  required: [at, message]
                  properties: { at: { type: string }, message: { type: string } }
            history:
              type: array
              items:
                type: object
                required: [t, ok, latencyMs]
                properties: { t: { type: string }, ok: { type: boolean }, latencyMs: { type: [number, 'null'] } }
        database:
          type: object
          required: [status, poolInUse, poolSize]
          properties:
            status: { $ref: '#/components/schemas/HealthStatus' }
            poolInUse: { type: integer }
            poolSize: { type: integer }
        cache:
          type: object
          required: [status, entries, bytes, maxBytes, hitRate, evictions]
          properties:
            status: { $ref: '#/components/schemas/HealthStatus' }
            entries: { type: integer }
            bytes: { type: integer }
            maxBytes: { type: integer }
            hitRate: { type: number }
            evictions: { type: integer }
        concurrency:
          type: object
          required: [status, inFlight, cap, queued]
          properties:
            status: { $ref: '#/components/schemas/HealthStatus' }
            inFlight: { type: integer }
            cap: { type: integer }
            queued: { type: integer }
        app:
          type: object
          required: [status, version, commit, startedAt, datasetsLoaded, datasetLoadErrors]
          properties:
            status: { $ref: '#/components/schemas/HealthStatus' }
            version: { type: string }
            commit: { type: string }
            startedAt: { type: string }
            datasetsLoaded: { type: integer }
            datasetLoadErrors: { type: array, items: { type: string } }
    AuditEntry:
      type: object
      required: [id, ts, actor, action, target, details]
      properties:
        id: { type: string }
        ts: { type: string }
        actor: { $ref: '#/components/schemas/UserRef' }
        action: { type: string, examples: [share.update, acl.update, canvas.transfer, admin.grant] }
        target: { type: string, description: 'e.g. "canvas:<id>", "user:<knoxId>", "component:<id>".' }
        details: { type: object }
