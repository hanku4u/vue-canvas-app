# Publish the `fab-canvas` npm package (docs/packaging.md).
# Runs only when a version tag like v0.1.0 is pushed, or by hand.
#
# Authentication is npm *trusted publishing* (OIDC): no token or 2FA code is involved.
# npmjs.com must list this repository and workflow (publish.yml) as a trusted publisher
# for the package; see docs/packaging.md. Provenance is attached automatically.
name: Publish package

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry-run:
        description: Build and verify, then `npm publish --dry-run`
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write # npm trusted publishing (OIDC) and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm >= 11.5.1.
      - run: npm install -g npm@^11.5.1
      - run: npm ci
      - name: Tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(node -p "require('./package.json').version")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME != package version v$version"; exit 1; }
      - run: npm run test:unit:run
      - run: npx playwright install --with-deps chromium
      - run: npm run build:package
      - run: npm run verify:package
      - name: Publish
        run: npm publish ./package --access public ${{ (github.event_name == 'workflow_dispatch' && inputs.dry-run) && '--dry-run' || '' }}
