[project]
name = "mock-data-api"
version = "0.1.0"
description = "Local stand-in for the internal fab data API. Serves deterministic dummy fab data."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "numpy>=2.1",
    "orjson>=3.10",
]

[project.scripts]
mock-data-api = "mock_data_api.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
